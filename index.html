<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer Olahraga</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
  <!-- Alarm Popup Overlay -->
  <div id="alarm-overlay" class="hidden">
    <div id="alarm-popup">
      <div class="alarm-icon">🏁</div>
      <h2>Waktu Habis!</h2>
      <p>Total waktu olahraga kamu sudah selesai.<br>Kerja bagus! 💪</p>
      <button id="stop-alarm-btn" onclick="stopAlarm()">🔕 Hentikan Alarm</button>
    </div>
  </div>

  <div class="container">
    <header>
      <div class="logo">⏱️</div>
      <h1>Timer Olahraga</h1>
      <p class="subtitle">Atur sesi olahraga & istirahatmu</p>
    </header>

    <!-- Settings Panel -->
    <section class="settings-card" id="settings-panel">
      <h2>⚙️ Pengaturan Timer</h2>
      <div class="settings-grid">
        <div class="setting-group">
          <label for="main-minutes">⏳ Waktu Total</label>
          <div class="input-row">
            <input type="number" id="main-minutes" min="1" max="300" value="30" />
            <span class="unit">menit</span>
          </div>
        </div>
        <div class="setting-group">
          <label for="exercise-minutes">🏋️ Waktu Olahraga (1 set)</label>
          <div class="input-row">
            <input type="number" id="exercise-minutes" min="0" max="59" value="1" />
            <span class="unit">menit</span>
            <input type="number" id="exercise-seconds" min="0" max="59" value="0" />
            <span class="unit">detik</span>
          </div>
        </div>
        <div class="setting-group">
          <label for="rest-minutes">😴 Waktu Istirahat (1 set)</label>
          <div class="input-row">
            <input type="number" id="rest-minutes" min="0" max="59" value="2" />
            <span class="unit">menit</span>
            <input type="number" id="rest-seconds" min="0" max="59" value="0" />
            <span class="unit">detik</span>
          </div>
        </div>
      </div>
      <button class="btn-start" id="start-btn" onclick="startSession()">▶ Mulai Sesi</button>
    </section>

    <!-- Active Timer Panel -->
    <section class="timer-card hidden" id="timer-panel">
      <!-- Main Timer -->
      <div class="main-timer-section">
        <div class="timer-label">⏳ Waktu Total Tersisa</div>
        <div class="main-timer-display" id="main-timer-display">00:00</div>
        <div class="main-progress-bar">
          <div class="main-progress-fill" id="main-progress"></div>
        </div>
        <div class="set-counter">Set ke-<span id="set-number">1</span> &bull; Total set: <span id="total-sets">-</span></div>
      </div>

      <!-- Sub Timers -->
      <div class="sub-timers">
        <!-- Exercise Timer -->
        <div class="sub-timer-card exercise-card" id="exercise-card">
          <div class="sub-icon">🏋️</div>
          <div class="sub-label">Olahraga</div>
          <div class="sub-timer-display" id="exercise-timer-display">00:00</div>
          <div class="sub-progress-bar">
            <div class="sub-progress-fill exercise-fill" id="exercise-progress"></div>
          </div>
        </div>

        <!-- Rest Timer -->
        <div class="sub-timer-card rest-card" id="rest-card">
          <div class="sub-icon">😴</div>
          <div class="sub-label">Istirahat</div>
          <div class="sub-timer-display" id="rest-timer-display">00:00</div>
          <div class="sub-progress-bar">
            <div class="sub-progress-fill rest-fill" id="rest-progress"></div>
          </div>
        </div>
      </div>

      <!-- Phase Banner -->
      <div class="phase-banner" id="phase-banner">
        <span id="phase-icon">🏋️</span>
        <span id="phase-text">Fase: Olahraga</span>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="btn-pause" id="pause-btn" onclick="togglePause()">⏸ Jeda</button>
        <button class="btn-reset" onclick="resetSession()">🔄 Reset</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
